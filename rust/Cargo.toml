[package]
name = "obsidian-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# Имя библиотеки должно совпадать с System.loadLibrary("obsidian") в Java.
name = "obsidian"
crate-type = ["cdylib"]

[dependencies]
# Ядро живёт в своём репозитории. Ревизия пинится жёстко, а не веткой:
# клиент обязан собираться тем же ядром, которым его собрали и подписали,
# иначе «проверьте сами» перестаёт быть проверкой. Обновление ядра —
# отдельный осознанный коммит сюда.
obsidian-core = { git = "https://github.com/ifny75/obsidian", rev = "27f83c47495230e064a34faba758c9f65323d4fe" }
jni = "0.21"

[features]
# Проброс фичи ядра: платный вход в TON по умолчанию выключен.
ton = ["obsidian-core/ton"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" здесь намеренно НЕ ставится: разворачивание стека через
# границу JNI — неопределённое поведение, и ловит его catch_unwind в lib.rs.
# С abort catch_unwind не сработал бы, и паника в ядре убивала бы приложение.
