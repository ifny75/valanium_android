[package]
name = "valanium-android"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# Имя библиотеки должно совпадать с System.loadLibrary("valanium") в Java.
name = "valanium"
crate-type = ["cdylib"]

[dependencies]
# Ядро живёт в своём репозитории. Ревизия пинится жёстко, а не веткой:
# клиент обязан собираться тем же ядром, которым его собрали и подписали.
valanium-core = { git = "https://github.com/ifny75/valanium_main", rev = "00f586bb5ae4ca0e366cb51b547352b5fd9b0f44" }
jni = "0.21"
hex = "0.4"
# Нужен только для встроенного Tor: он поднимается в своей среде выполнения.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[features]
# Проброс фичи ядра: платный вход в TON по умолчанию выключен.
ton = ["valanium-core/ton"]
# Встроенный Tor. На Android он обязан ехать внутри: система с Android 10
# запрещает исполнять файлы из каталога данных приложения, поэтому модель
# «скачать бинарь и запустить», как на Windows, здесь неприменима.
tor-embedded = ["valanium-core/tor-embedded", "dep:tokio"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# panic = "abort" здесь намеренно НЕ ставится: разворачивание стека через
# границу JNI — неопределённое поведение, и ловит его catch_unwind в lib.rs.
# С abort catch_unwind не сработал бы, и паника в ядре убивала бы приложение.
